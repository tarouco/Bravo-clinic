<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bravô Clinic – Salas Inteligentes | Praia Brava, Itajaí</title>
    <meta
      name="description"
      content="Salas clínicas e estúdios de alto padrão para alugar por hora, meio turno ou turno na Praia Brava, em Itajaí – SC. Reserve online."
    />
    <meta name="theme-color" content="#63391c" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- GES-143: the font stylesheet is preloaded at high priority but attached as `print`, so it
         never blocks the first paint or the module script; src/main.tsx switches it to `all`. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      data-brand-fonts
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bravô Clinic" />
    <meta property="og:title" content="Bravô Clinic – Salas Inteligentes" />
    <meta property="og:description" content="Saúde · Beleza · Bem-estar em um só lugar" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bravô Clinic – Salas Inteligentes" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Bravô Clinic – Salas Inteligentes",
        "description": "Salas clínicas e estúdios de alto padrão para alugar por hora, meio turno ou turno.",
        "url": "%VITE_SITE_URL%",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Praia Brava",
          "addressLocality": "Itajaí",
          "addressRegion": "SC",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "07:00",
            "closes": "23:59"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday", "Sunday"],
            "opens": "09:00",
            "closes": "23:59"
          }
        ]
      }
    </script>

    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('bravo-theme');
        } catch (e) {}
        if (theme !== 'day' && theme !== 'night') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'night'
              : 'day';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- GES-143: on / preload the hero (the tour poster on phones, the room photo above 768 px).
         On /salas and /salas/:slug, start the room request before the bundle runs and preload
         the photo the page paints first (same srcset/sizes as its <img>). src/lib/api.ts takes
         the response over. Its sha256 is in the netlify.toml CSP (static-seo.test.ts). -->
    <script>
      (function () {
        function preload(href, attributes) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = href;
          link.setAttribute('fetchpriority', 'high');
          for (var name in attributes) link.setAttribute(name, attributes[name]);
          document.head.appendChild(link);
        }
        if (location.pathname === '/') {
          preload('/images/tour-poster.webp', { media: '(max-width: 767px)' });
          preload('/images/sala-principal.webp', { media: '(min-width: 768px)' });
          return;
        }
        var match = /^\/salas(?:\/([a-z0-9-]{1,60}))?\/?$/.exec(location.pathname);
        if (!match || typeof fetch !== 'function') return;
        var slug = match[1];
        var path = slug ? '/api/public/rooms/' + slug : '/api/public/rooms';
        var response = fetch(path, {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' },
        });
        window.__bravoEarly = { path: path, response: response };
        response
          .then(function (res) {
            return res.ok ? res.clone().json() : null;
          })
          .then(function (data) {
            if (!data) return;
            var photo = slug
              ? (data.photos && data.photos[0]) || data.cover
              : data.items && data.items[0] && data.items[0].cover;
            var href = (photo && photo.url) || '/room-placeholder.webp';
            preload(
              href,
              /-large\.webp$/.test(href)
                ? {
                    imagesrcset:
                      href.replace(/-large\.webp$/, '-small.webp') + ' 800w, ' + href + ' 1600w',
                    imagesizes: slug
                      ? '(min-width: 1024px) 60vw, 100vw'
                      : '(min-width: 1024px) 33vw, 100vw',
                  }
                : {},
            );
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
