<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bravô Clinic – Salas Inteligentes | Praia Brava, Itajaí</title>
    <meta
      name="description"
      content="Salas clínicas e estúdios de alto padrão para alugar por hora, meio turno ou turno na Praia Brava, em Itajaí – SC. Reserve online."
    />
    <meta name="theme-color" content="#63391c" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- GES-143: the font stylesheet is preloaded at high priority but attached as `print`, so it
         never blocks the first paint or the module script; src/main.tsx switches it to `all`. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      data-brand-fonts
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bravô Clinic" />
    <meta property="og:title" content="Bravô Clinic – Salas Inteligentes" />
    <meta property="og:description" content="Saúde · Beleza · Bem-estar em um só lugar" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bravô Clinic – Salas Inteligentes" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Bravô Clinic – Salas Inteligentes",
        "description": "Salas clínicas e estúdios de alto padrão para alugar por hora, meio turno ou turno.",
        "url": "%VITE_SITE_URL%",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Praia Brava",
          "addressLocality": "Itajaí",
          "addressRegion": "SC",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "07:00",
            "closes": "23:59"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday", "Sunday"],
            "opens": "09:00",
            "closes": "23:59"
          }
        ]
      }
    </script>

    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('bravo-theme');
        } catch (e) {}
        if (theme !== 'day' && theme !== 'night') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'night'
              : 'day';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
