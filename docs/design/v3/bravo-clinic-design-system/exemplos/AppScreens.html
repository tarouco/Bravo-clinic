<!doctype html>
<html lang="pt-BR" data-theme="light"><head><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/bundle.js"></script><meta charset="utf-8"><title>AppScreens</title>
<style>
html,body{margin:0}
body{background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.phones{display:flex;gap:40px;justify-content:center;padding:40px 20px}
.phone{width:300px;height:630px;border-radius:46px;padding:9px;background:linear-gradient(180deg,#fdfdfc,#e4e2de);box-shadow:var(--lift-3)}
[data-theme="dark"] .phone{background:linear-gradient(180deg,#6d4c24,#3a240c)}
.scr{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--surface)}
.status{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:11px;font-weight:500}
.pad{padding:16px 20px}
.top{display:flex;align-items:center;justify-content:space-between}
.av{width:42px;height:42px;border-radius:50%;background:var(--grad-gold);color:var(--on-gold);box-shadow:var(--relief-gold);display:grid;place-items:center;font-family:var(--font-display);font-size:16px}
.t1{font-family:var(--font-display);font-weight:300;font-size:30px;letter-spacing:.03em;margin:18px 0 16px}
.feat{height:170px}
.feat .bv-card-title{font-weight:300;font-size:24px;margin:0}
.feat .cap{font-size:12px;color:var(--gold)}
.feat .bv-btn{position:absolute;left:20px;bottom:18px}
.feat .ph{position:absolute;right:-18px;bottom:-18px;width:150px;height:150px;border-radius:var(--radius-lg);background:url(../imagens/reception.jpg) center/cover;transform:rotate(-8deg);box-shadow:0 18px 30px rgba(5,30,22,.45)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.tile{padding:16px;border-radius:var(--radius-md)}
.tile .bv-icon-btn{margin-bottom:12px}
.tile b{font-family:var(--font-display);font-weight:400;font-size:15px;display:block}
.tile span{font-size:11px;color:var(--ink-muted)}
.tile.bv-card--gold span{color:var(--on-gold)}
.photo{position:absolute;inset:0 0 auto 0;height:330px;background:url(../imagens/facade-dusk.jpg) 52% 50%/cover}
.ptop{position:relative;display:flex;justify-content:space-between;padding:18px}
.price{position:absolute;right:22px;top:262px;z-index:2;padding:10px 16px;border-radius:18px;background:var(--grad-gold);color:var(--on-gold);box-shadow:var(--relief-gold);font-family:var(--font-display);font-size:16px}
.price small{display:block;font-family:var(--font-sans);font-size:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;top:290px;padding:26px 22px;border-radius:var(--radius-xl) var(--radius-xl) 38px 38px;background:var(--surface);box-shadow:0 -20px 40px rgba(60,45,30,.18)}
.sheet h2{font-family:var(--font-display);font-weight:300;font-size:28px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
.sub{font-size:12px;color:var(--ink-muted);margin-bottom:18px}
.am{display:flex;gap:10px;margin-bottom:20px}
.am span{width:46px;height:46px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--grad-pearl);box-shadow:var(--relief-pearl)}
.am svg{width:20px;height:20px;stroke:var(--emerald);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .am svg{stroke:var(--gold)}
.slots{display:flex;gap:8px;margin-bottom:22px}
.slots .bv-chip{flex:1;min-width:0;padding:0;height:38px;font-size:13px}
.bk{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--radius-md);margin:12px 0}
.bk .p{width:54px;height:54px;border-radius:18px;background-size:cover;background-position:center;flex:none}
.bk b{display:block;font-family:var(--font-display);font-weight:400;font-size:15px}
.bk span{font-size:11px;color:var(--ink-muted)}
.bk .t{margin-left:auto;padding:8px 12px;border-radius:999px;background:var(--grad-gold);color:var(--on-gold);box-shadow:var(--relief-gold);font-family:var(--font-display);font-size:14px}
.ring{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--radius-md)}
.ring .r{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--emerald) 0 75%,rgba(88,55,20,.18) 75% 100%);display:grid;place-items:center}
.ring .r i{width:42px;height:42px;border-radius:50%;background:#fff3c2;display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-size:13px}
.ring b{font-family:var(--font-display);font-weight:400;font-size:15px;display:block}
.ring span{font-size:11px}
</style></head><body><div style="position:fixed;right:14px;top:14px;z-index:99;display:flex;gap:6px;font:500 12px Jost,sans-serif"><button onclick="document.documentElement.dataset.theme='light'" style="border:0;border-radius:99px;padding:6px 12px;cursor:pointer">Dia</button><button onclick="document.documentElement.dataset.theme='dark'" style="border:0;border-radius:99px;padding:6px 12px;cursor:pointer;background:#583714;color:#ffeb97">Noite</button></div>

<div class="t1">Olá, Helena</div>

<div class="phone"><div class="scr"><div class="photo"></div>
<div class="ptop"><button class="bv-icon-btn bv-icon-btn--sm bv-btn--pearl" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="bv-icon-btn bv-icon-btn--sm bv-btn--pearl" aria-label="Favoritar"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button></div>
