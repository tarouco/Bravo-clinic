name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run on the same ref replaces the one in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # API integration tests run against a real Postgres 17 (AD-018); btree_gist ships with the image.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Playwright suite (nucleo, receita, gestao T45/T46) against the same Postgres 17 service: the
      # harness resets, migrates and seeds it, serves the API on :8787 and a `vite preview` build
      # on :5173, and drives the runner's Google Chrome. Every value below is test-only.
      - run: npm run e2e -w apps/web
        env:
          SESSION_SECRET: e2e-session-secret-0123456789abcdef0123456789
          ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          APP_BASE_URL: http://localhost:5173
          EMAIL_FROM: reservas@bravoclinic.test
      - run: npm run build
        env:
          API_PROXY_ORIGIN: https://example.invalid
          VITE_SITE_URL: https://example.invalid
