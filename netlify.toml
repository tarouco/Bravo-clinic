# Netlify build and response headers (docs/architecture.md section 8, AD-014, AD-016).
#
# `dist/_redirects` is generated by apps/web/scripts/write-redirects.mjs from API_PROXY_ORIGIN,
# a Netlify environment variable per deploy context (production -> production function URL,
# deploy-preview and branch-deploy -> dev function URL). Set it in the Netlify UI or CLI, never here.
# VITE_SITE_URL is set the same way.

[build]
  command = "npm run build -w apps/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# Headers apply to files Netlify serves, not to the proxied /api/* responses (the API sets its own).
#
# script-src carries the sha256 of the inline no-flash theme script in apps/web/index.html.
# Update the hash whenever that script changes:
#   node -e "const h=require('fs').readFileSync('apps/web/dist/index.html','utf8');
#   const s=h.match(/<script>([\s\S]*?)<\/script>/)[1];
#   console.log('sha256-'+require('crypto').createHash('sha256').update(s).digest('base64'))"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-gHCc3FFg63IliCSRhq+zdQ/NDm7IZhVe0DTFwipqghQ=' https://www.googletagmanager.com https://us-assets.i.posthog.com https://eu-assets.i.posthog.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://us.i.posthog.com https://eu.i.posthog.com https://us-assets.i.posthog.com https://eu-assets.i.posthog.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite fingerprints everything under /assets, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell and the service worker must always revalidate so deploys and PWA updates are seen.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# push-sw.js is imported by the service worker (GES-82): a stale copy would delay handler fixes.
[[headers]]
  for = "/push-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
